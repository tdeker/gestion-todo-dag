<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Todo Dog</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header>
    <div class="proj">
      <div class="brand">
        <svg class="logo-light" viewBox="0 0 200 200" aria-hidden="true"> <rect width="200" height="200" rx="46" fill="#FFF8EC"></rect> <rect x="1.5" y="1.5" width="197" height="197" rx="45" fill="none" stroke="#E7DDC9" stroke-width="3"></rect> <g fill="#1F2A44"> <ellipse cx="60" cy="84" rx="14.5" ry="18.5" transform="rotate(-22 60 84)"></ellipse> <ellipse cx="86" cy="60" rx="14.5" ry="19.5" transform="rotate(-6 86 60)"></ellipse> <ellipse cx="114" cy="60" rx="14.5" ry="19.5" transform="rotate(6 114 60)"></ellipse> <ellipse cx="140" cy="84" rx="14.5" ry="18.5" transform="rotate(22 140 84)"></ellipse> <path d="M100 98 C127 98 147 118 147 139 C147 157 133 163 121 161 C112 160 106 155 100 155 C94 155 88 160 79 161 C67 163 53 157 53 139 C53 118 73 98 100 98 Z"></path> </g> <path d="M80 131 L95 145 L122 117" fill="none" stroke="#F2B33D" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path> </svg>
        <svg class="logo-dark" viewBox="0 0 200 200" aria-hidden="true"> <rect width="200" height="200" rx="46" fill="#1F2A44"></rect> <g fill="#FFF8EC"> <ellipse cx="60" cy="84" rx="14.5" ry="18.5" transform="rotate(-22 60 84)"></ellipse> <ellipse cx="86" cy="60" rx="14.5" ry="19.5" transform="rotate(-6 86 60)"></ellipse> <ellipse cx="114" cy="60" rx="14.5" ry="19.5" transform="rotate(6 114 60)"></ellipse> <ellipse cx="140" cy="84" rx="14.5" ry="18.5" transform="rotate(22 140 84)"></ellipse> <path d="M100 98 C127 98 147 118 147 139 C147 157 133 163 121 161 C112 160 106 155 100 155 C94 155 88 160 79 161 C67 163 53 157 53 139 C53 118 73 98 100 98 Z"></path> </g> <path d="M80 131 L95 145 L122 117" fill="none" stroke="#1F2A44" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path> <circle cx="152" cy="48" r="12" fill="#F2B33D"></circle> </svg>
        <span class="wordmark" role="img" aria-label="Todo Dog">todo<b>dog</b></span>
        <span class="eyebrow">Projets et dépendances</span>
      </div>
      <div class="proj-row">
        <button class="btn proj-btn" id="projBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="projMenu">
          Projets <b id="projCount"></b> <span aria-hidden="true">▾</span>
        </button>
        <input id="projectName" type="text" aria-label="Nom du projet" autocomplete="off">
      </div>
      <div class="proj-menu" id="projMenu" role="menu" aria-label="Projets" hidden>
        <div class="proj-menu-head">Mes projets</div>
        <ul id="projList"></ul>
        <div class="proj-actions">
          <button type="button" role="menuitem" data-pact="new">+ Nouveau projet</button>
          <button type="button" role="menuitem" data-pact="sample">+ Projet d'exemple</button>
          <button type="button" role="menuitem" data-pact="sampleBig">+ Exemple volumineux (~130 tâches)</button>
          <button type="button" role="menuitem" class="danger" data-pact="delete">Supprimer ce projet</button>
        </div>
      </div>
    </div>
    <div class="progress"><div class="bar"><i id="barFill"></i></div><span class="pct" id="pct"></span><span class="late-pill" id="lateCount"></span></div>
    <div class="next-ms" id="nextMs" hidden></div>
  </header>

  <aside>
    <div class="panel">
      <div class="counts" id="counts"></div>
    </div>

    <div class="panel">
      <h2>Prêtes à démarrer <b id="nReady"></b></h2>
      <ul class="list" id="readyList"></ul>
    </div>

    <div class="panel">
      <h2>En cours <b id="nDoing"></b></h2>
      <ul class="list" id="doingList"></ul>
    </div>

    <div class="panel" id="detail"></div>

    <div class="panel">
      <h2>Nouvelle tâche</h2>
      <form class="add" id="addForm">
        <input id="newTitle" type="text" placeholder="Ex. Valider le budget" autocomplete="off" aria-label="Titre de la nouvelle tâche">
        <textarea id="newDesc" rows="2" placeholder="Description (facultatif)" aria-label="Description de la nouvelle tâche"></textarea>
        <label class="check" for="newMs"><input type="checkbox" id="newMs"> <span>C'est un <b>jalon</b> <span class="hint">(point de passage daté, sans durée)</span></span></label>
        <div class="grid2">
          <div><label class="label" for="newOwner">Responsable</label><input id="newOwner" type="text" list="ownerList" placeholder="Nom" autocomplete="off"></div>
          <div><label class="label" for="newDue">Échéance</label><input id="newDue" type="date"></div>
        </div>
        <div class="row"><span></span><button class="btn primary" type="submit">Ajouter une tâche</button></div>
      </form>
      <datalist id="ownerList"></datalist>
      <p class="hint" id="addHint">Si une tâche est sélectionnée, la nouvelle en dépendra.</p>
    </div>

    <footer class="note" id="syncNote" aria-live="polite">Chargement…</footer>
  </aside>

  <section class="graph">
    <div class="graph-head">
      <div class="views">
        <div class="seg seg-2" role="group" aria-label="Vue">
          <button type="button" data-view="seq">Séquence</button>
          <button type="button" data-view="kanban">Kanban</button>
          <button type="button" data-view="table">Tableau</button>
        </div>
        <div class="seg seg-2" role="group" aria-label="Colonnes du Kanban" id="kbGroup">
          <button type="button" data-group="status">Par statut</button>
          <button type="button" data-group="owner">Par personne</button>
        </div>
      </div>
      <div class="legend">
        <span><i class="dot ready"></i>Prête</span>
        <span><i class="dot doing"></i>En cours</span>
        <span><i class="dot blocked"></i>Bloquée</span>
        <span><i class="dot done"></i>Faite</span>
        <span><i class="dia-lg" aria-hidden="true"></i>Jalon</span>
        <span class="seq-only"><i class="ln-bad"></i>Prérequis prévu après</span>
      </div>
      <label class="filter-who" for="whoFilter">Responsable
        <select id="whoFilter"></select>
      </label>
    </div>
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input type="search" id="q" placeholder="Rechercher (titre, description, personne, #n°)" aria-label="Rechercher une tâche" autocomplete="off">
        <kbd title="Raccourci clavier">/</kbd>
      </div>
      <span class="q-count" id="qCount" aria-live="polite"></span>
      <label class="check" for="hideDone"><input type="checkbox" id="hideDone"> Masquer les faites <span class="muted" id="doneCount"></span></label>
      <div class="tb-right seq-only">
        <div class="seg seg-3" role="group" aria-label="Échelle de temps">
          <button type="button" data-zoom="day">Jour</button>
          <button type="button" data-zoom="week">Semaine</button>
          <button type="button" data-zoom="month">Mois</button>
        </div>
        <button class="btn" type="button" id="goToday">Aujourd'hui</button>
      </div>
    </div>
    <div class="canvas" id="canvas"><svg id="g" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="kanban" id="kanban" hidden></div>
    <div class="table-view" id="tableView" hidden></div>
    <p class="hint kb-help" id="kbHelp" hidden></p>
  </section>
</div>

<div class="toast" id="toast" role="status" hidden><span></span><button class="btn" id="toastUndo" type="button">Annuler</button></div>

<script src="app.js"></script>
</body>
</html>
